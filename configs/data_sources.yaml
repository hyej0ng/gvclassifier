  gv_labels_usage: authoritative_exact_taxonomy_for_NCLDV_and_MIRUS_only
  provisional_genome_taxonomy: /media/shared-expansion/db/gv-exports/old/genome_taxonomy.tsv
  provisional_usage: NCLDV_genus_split_grouping_only_not_taxonomy_training_target

sources:
  ARC:
    status: present
    path: /home/fschulz/share/hyejong/genomes-training/order_representatives_2026-09-03/fna
    metadata_path: /home/fschulz/share/hyejong/genomes-training/order_representatives_2026-09-03/metadata.tsv
    file_glob: "ARC__*.fna"
    format: per_genome_fna
    header_pattern: "ARC__<genome_id>|<contig_id>"
    metadata_join_key: filename
    taxonomy_priority: snapshot_metadata
    main_label: 0
    sub_label: null
    record_type: cellular_genome
    split_key: genome_id_then_similarity_component

  BAC:
    status: present
    path: /home/fschulz/share/hyejong/genomes-training/order_representatives_2026-09-03/fna
    metadata_path: /home/fschulz/share/hyejong/genomes-training/order_representatives_2026-09-03/metadata.tsv
    file_glob: "BAC__*.fna"
    format: per_genome_fna
    header_pattern: "BAC__<genome_id>|<contig_id>"
    metadata_join_key: filename
    taxonomy_priority: snapshot_metadata
    main_label: 0
    sub_label: null
    record_type: cellular_genome
