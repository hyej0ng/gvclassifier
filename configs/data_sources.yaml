    metadata_path: /home/fschulz/share/hyejong/genomes-training/organelle_host_balanced_2026-09-10/metadata.tsv
    supporting_files:
      - /home/fschulz/share/hyejong/genomes-training/organelle_host_balanced_2026-09-10/source_metadata.tsv
      - /home/fschulz/share/hyejong/genomes-training/organelle_host_balanced_2026-09-10/source_audit.tsv
      - /home/fschulz/share/hyejong/genomes-training/organelle_host_balanced_2026-09-10/selection.tsv
