    file_glob: "MITO__*.fna"
    format: per_genome_fna
    header_pattern: "<accession> <original_NCBI_description>"
    genome_id_from: filename_without_prefix_and_extension
    metadata_join_key: filename
    taxonomy_priority: snapshot_metadata
    main_label: 0
    sub_label: null
    record_type: mitochondrial_genome
    split_key: genome_id_then_similarity_component

  PLASTID:
    status: present
    path: /home/fschulz/share/hyejong/genomes-training/organelle_host_balanced_2026-09-10/fna
    metadata_path: /home/fschulz/share/hyejong/genomes-training/organelle_host_balanced_2026-09-10/metadata.tsv
